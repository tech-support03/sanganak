# The ISO's bundled package repo (built by iso/build.sh). bootstrap.sh
# pacstraps from it when OFFLINE_CONF points here, so the core install needs
# no network. Packages were fetched from the official mirrors at build time.
[options]
HoldPkg      = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel     = Never

[offline]
SigLevel = Never
Server = file:///var/cache/sanganak/offline
