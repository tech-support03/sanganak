<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ~/.config/fontconfig/fonts.conf
     System-wide defaults: SF Pro for UI text, JetBrains Mono for terminals.
     SF Pro (apple-fonts, AUR) has no Devanagari, so Noto Sans Devanagari
     (noto-fonts) is the next fallback; संगणक and other Devanagari text render
     from it. If apple-fonts failed to build, Noto Sans takes over. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>Noto Sans</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
